name: Deploy to GitHub Pages

on:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.12.0
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Build
              run: npm run build 2>&1 | tee /tmp/build.log
              env:
                  SITE_URL: ${{ secrets.SITE_URL || 'https://masrizram.github.io' }}
            - name: Show build log on failure
              if: ${{ failure() }}
              run: cat /tmp/build.log
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
