name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

permissions:
    contents: read

jobs:
    quality:
        name: Quality gates
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Gate 1 — formatting konsisten (Prettier).
            - name: Format check
              run: npm run format:check

            # Gate 2 — lint & aksesibilitas JSX (ESLint + jsx-a11y).
            - name: Lint
              run: npm run lint

            # Gate 3 — tipe & diagnostik Astro.
            - name: Type check
              run: npm run check

            # Gate 4 — unit test.
            - name: Unit tests
              run: npm run test

            # Gate 5 — kerentanan dependensi. Gagal bila ada high/critical.
            - name: Security audit
              run: npm audit --audit-level=high

            # Gate 6 — build produksi harus sukses.
            - name: Build
              run: npm run build
              env:
                  SITE_URL: ${{ secrets.SITE_URL || 'https://masrizram.github.io/notes' }}

            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist
                  retention-days: 7
