name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Type & lint check (astro check)
              run: npm run check

            - name: Build
              run: npm run build
              env:
                  # URL produksi untuk canonical/OG/sitemap. Ganti di Settings > Secrets.
                  SITE_URL: ${{ secrets.SITE_URL || 'https://masrizram.github.io/notes' }}
