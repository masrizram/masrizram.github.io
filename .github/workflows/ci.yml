name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

permissions:
    contents: read

env:
    SITE_URL: ${{ secrets.SITE_URL || 'https://masrizram.github.io/notes' }}

jobs:
    quality:
        name: Quality gates
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Gate 1 — formatting konsisten (Prettier).
            - name: Format check
              run: npm run format:check

            # Gate 2 — lint & aksesibilitas JSX (ESLint + jsx-a11y).
            - name: Lint
              run: npm run lint

            # Gate 3 — tipe & diagnostik Astro.
            - name: Type check
              run: npm run check

            # Gate 4 — unit test.
            - name: Unit tests
              run: npm run test

            # Gate 5 — kerentanan dependensi. Gagal bila ada high/critical.
            - name: Security audit
              run: npm audit --audit-level=high

            # Gate 6 — build produksi harus sukses.
            - name: Build
              run: npm run build

            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist
                  retention-days: 7

    e2e:
        name: E2E + aksesibilitas (Playwright + axe)
        runs-on: ubuntu-latest
        needs: quality
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - run: npm ci

            - name: Install Playwright browser
              run: npx playwright install --with-deps chromium

            - name: Build
              run: npm run build

            # Gate 7 — smoke semua rute + audit axe-core WCAG 2.1 A/AA.
            - name: Run E2E tests
              run: npx playwright test

            - name: Upload Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report
                  retention-days: 7

    lighthouse:
        name: Core Web Vitals (Lighthouse CI)
        runs-on: ubuntu-latest
        needs: quality
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - run: npm ci

            - name: Build
              run: npm run build

            # Gate 8 — budget performa: LCP < 2.5s, CLS < 0.1, TBT < 200ms.
            # Catatan: INP adalah metrik lapangan (field); TBT adalah proksi lab
            # yang setara untuk gating di CI.
            - name: Lighthouse CI
              run: npm install -g @lhci/cli@0.14.x && lhci autorun
              env:
                  LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
